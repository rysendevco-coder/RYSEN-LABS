# Rysen Labs Dashboard application registry.
# Entries marked as examples may need container names, ports, or health URLs adjusted
# after the ZimaBoard filesystem is healthy and services are confirmed.
applications:
  - id: casaos
    name: CasaOS
    description: ZimaBoard home server control plane and app catalog.
    category: Platform
    icon: layout-dashboard
    url: http://192.168.50.42
    internal_health_url: http://192.168.50.42
    expected_port: 80
    enabled: true
    health_check_enabled: false
    timeout_seconds: 2
    display_order: 10

  - id: jellyfin-example
    name: Jellyfin
    description: Example media library card. Enable health checks after deployment is confirmed.
    category: Media
    icon: film
    url: http://192.168.50.42:8096
    internal_health_url: http://192.168.50.42:8096/health
    container_name: jellyfin
    expected_port: 8096
    enabled: true
    health_check_enabled: false
    timeout_seconds: 2
    display_order: 20

  - id: photoprism-example
    name: PhotoPrism
    description: Example private photo library card. Container details may need adjustment.
