    icon: image
    url: http://192.168.50.42:2342
    internal_health_url: http://192.168.50.42:2342
    container_name: photoprism
    expected_port: 2342
    enabled: true
    health_check_enabled: false
    timeout_seconds: 2
    display_order: 30

  - id: pokemonsniper-example
    name: PokemonSniper
    description: Example RYSEN Labs Pokemon card discovery app entry. Not assumed deployed.
    category: Apps
    icon: target
    url: http://192.168.50.42:3000
