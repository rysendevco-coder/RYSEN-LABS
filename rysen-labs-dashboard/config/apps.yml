    container_name: pokemonsniper
    expected_port: 3000
    enabled: false
    health_check_enabled: false
    timeout_seconds: 2
    display_order: 40

  - id: motorminder-example
    name: MotorMinder
    description: Example vehicle service and maintenance app entry. Not assumed deployed.
    category: Apps
    icon: wrench
    url: http://192.168.50.42:8081
    internal_health_url: http://192.168.50.42:8081/health
    container_name: motorminder
    expected_port: 8081
    enabled: false
    health_check_enabled: false
