[project]
name = "rysen-labs-dashboard"
version = "0.3.0"
description = "Mobile-first LAN operations dashboard for the rysen-labs ZimaBoard."
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pydantic>=2.8.0",
    "psutil>=6.0.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
